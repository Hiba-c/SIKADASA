
annotations:
  anybuild.run/config:
    composer_build_script: post-update-cmd
    composer_enable: true
    name: out
    node_build_command: npm run build
    node_install_inputs:
    - package.json
    node_package_manager: npm
    npm_version: '11'
    php_framework: laravel
    php_public_dir: public
    phpix: true
  anybuild.run/provider: laravel
  anybuild.run/version: 0.33.2
  wasmer.io/version: 7.5.0
app_id: da_KwGIWtMUZkVx
enableDatabase: true
enable_email: true
env:
  PHPIX_PHP_THREADS: '4'
jobs:
  - name: migrate-database
    trigger: post-deployment
    action:
      execute:
        command: php
        cli_args:
          - /app/artisan
          - migrate
          - --force

